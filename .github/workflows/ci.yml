name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Global pipeline environment variables and architectural feature flags
env:
  # Feature flag governance (TASK-27 NO-GO / ADR-0011 / V&V §13.5):
  # Optional intermediate dishes (chef batch registration, RF-36..38) are excluded
  # for the 7-sprint horizon (code and tests live or die together).
  # Kept directly in workflow env to avoid committing standalone .env files into Git.
  INTERMEDIATE_DISHES_ENABLED: 'false'
  # Force all JavaScript-based actions to execute using the Node 24 runtime,
  # preventing Node 20 deprecation warnings and future-proofing runner execution.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  validate-pr:
    name: Validate PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Validate branch name
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: |
          if [[ "$BRANCH_NAME" == "develop" ]]; then
            echo "Skipping branch name validation for develop branch"
            exit 0
          fi
          if [[ ! "$BRANCH_NAME" =~ ^[a-z0-9]+-[a-z]+$ ]]; then
            echo "Error: Branch name '$BRANCH_NAME' does not match pattern ^[a-z0-9]+-[a-z]+$"
            exit 1
          fi
      - name: Validate PR title (Conventional Commits)
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-and-types:
    name: Lint, Types & Secrets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Gitleaks
        run: |
          curl --proto "=https" --tlsv1.2 -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz
          ./gitleaks detect --source . -v

      - name: Run ESLint
        run: pnpm run lint

      - name: Run TypeScript type check
        run: pnpm exec tsc --noEmit

  unit-tests:
    name: Unit Tests
    needs: build-federation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: "pnpm"

      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: federation-dist
          path: dist

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vitest with coverage
        run: pnpm run test:coverage

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unit-test-results
          path: |
            coverage/lcov.info
            junit.xml
          retention-days: 14
          if-no-files-found: warn

  sonarcloud:
    name: SonarCloud Analysis
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Download test results
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unit-test-results

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarCloud Quality Gate Check
        if: github.ref == 'refs/heads/main'
        uses: SonarSource/sonarqube-quality-gate-action@d304d050d930b02a896b0f85935344f023928496 # v1.1.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-federation:
    name: Build Federation
    needs: lint-and-types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Module Federation
        run: pnpm run build

      - name: Upload federation dist artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: federation-dist
          path: dist/
          retention-days: 14
          if-no-files-found: warn

  e2e:
    name: End-to-End Tests
    needs: build-federation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: federation-dist
          path: dist

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Run Playwright E2E tests
        run: pnpm run test:e2e

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: warn

      - name: Send Playwright Report to Discord
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_REPORTS }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          TEST_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK_REPORTS is not set; skipping notification."
            exit 0
          fi

          STATUS_TEXT="Success"
          if [ "$TEST_STATUS" != "success" ]; then
            STATUS_TEXT="Failed or Cancelled"
          fi

          MESSAGE="**Playwright E2E Tests Report ($STATUS_TEXT)**"$'\n'"**Branch:** \`$REF_NAME\` | **Commit:** \`$SHA\`"$'\n'"**Run:** $SERVER_URL/$REPO/actions/runs/$RUN_ID"

          curl -s -S -X POST \
            -H "Content-Type: application/json" \
            -d "{\"content\": \"$MESSAGE\"}" \
            "$DISCORD_WEBHOOK" > /dev/null || echo "Warning: Failed to deliver Discord notification."
          echo "Playwright notification sent to Discord."

  a11y:
    name: Accessibility Tests
    needs: build-federation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: federation-dist
          path: dist

      - name: Install Playwright Browsers
        run: pnpm exec playwright install --with-deps

      - name: Run Accessibility Tests
        run: pnpm run test:a11y

      - name: Upload Axe Report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: axe-report
          path: |
            axe-report/
            reports/axe/
            axe-report.json
          retention-days: 14
          if-no-files-found: warn

  zap-baseline:
    name: ZAP Baseline Scan
    needs: build-federation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: federation-dist
          path: dist

      - name: Start Preview Server
        shell: bash
        run: |
          set -euo pipefail
          pnpm run preview --host 0.0.0.0 --port 4173 > /tmp/preview.log 2>&1 &
          echo $! > /tmp/preview.pid

      - name: Wait for Preview Server
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:4173 > /dev/null 2>&1; then
              echo "Preview server is ready"
              exit 0
            fi
            if ! kill -0 "$(cat /tmp/preview.pid)" 2>/dev/null; then
              echo "Preview server exited unexpectedly:"
              cat /tmp/preview.log
              exit 1
            fi
            sleep 1
          done
          echo "Preview server did not become ready:"
          cat /tmp/preview.log
          exit 1

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://127.0.0.1:4173
          rules_file_name: '.zap/rules.tsv'
          fail_action: true
          # Security (TASK-39): never open a public issue with scan findings.
          allow_issue_writing: false
          artifact_name: zap-baseline-report

      - name: Send ZAP Report to Discord
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_REPORTS }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SCAN_STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK_REPORTS is not set; skipping notification."
            exit 0
          fi

          REPORT_FILE=""
          for candidate in "zap-baseline-report.html" "zap_report.html" "report_html.html" "report_md.md"; do
            if [ -f "$candidate" ]; then
              REPORT_FILE="$candidate"
              break
            fi
          done

          STATUS_TEXT="Success"
          if [ "$SCAN_STATUS" != "success" ]; then
            STATUS_TEXT="Warnings or Errors Detected"
          fi

          MESSAGE="**OWASP ZAP Baseline Scan Report ($STATUS_TEXT)**"$'\n'"**Branch:** \`$REF_NAME\` | **Commit:** \`$SHA\`"$'\n'"**Run:** $SERVER_URL/$REPO/actions/runs/$RUN_ID"

          if [ -n "$REPORT_FILE" ]; then
            curl -s -S -X POST \
              -F "content=$MESSAGE" \
              -F "file=@$REPORT_FILE" \
              "$DISCORD_WEBHOOK" > /dev/null || echo "Warning: Failed to deliver Discord notification."
            echo "ZAP report sent to Discord with attachment: $REPORT_FILE"
          else
            curl -s -S -X POST \
              -H "Content-Type: application/json" \
              -d "{\"content\": \"$MESSAGE\n*(No report file found on runner)*\"}" \
              "$DISCORD_WEBHOOK" > /dev/null || echo "Warning: Failed to deliver Discord notification."
            echo "ZAP notification sent to Discord without attachment."
          fi

  notify-on-failure:
    name: Notify on Failure
    needs: [validate-pr, lint-and-types, unit-tests, build-federation, e2e, a11y, zap-baseline, sonarcloud]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Send Discord Alert
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          REF_NAME: ${{ github.ref_name }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK_ALERTS is not set; skipping notification."
            exit 0
          fi
          MESSAGE="The pipeline has failed on branch ${REF_NAME}! Check the logs here: ${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}"
          curl -s -S -X POST -H "Content-Type: application/json" -d "{\"content\": \"$MESSAGE\"}" "$DISCORD_WEBHOOK" > /dev/null || echo "Warning: Failed to deliver Discord notification."

  build-and-push:
    name: Build & Push Docker Image
    needs: [sonarcloud, build-federation, e2e, a11y, zap-baseline]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Lowercase Repository Name
        id: repo_name
        run: |
          echo "REPO=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}
          echo "repo=${GITHUB_REPOSITORY,,}" >> ${GITHUB_OUTPUT}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ steps.repo_name.outputs.repo }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha

      - name: Build and Push Image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Notify Release
        if: success()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_RELEASES }}
          SHA: ${{ github.sha }}
          STATUS: ${{ job.status }}
        shell: bash
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK_RELEASES is not set; skipping notification."
            exit 0
          fi
          MESSAGE="Docker image build and push completed for ${SHA}. Status: ${STATUS}"
          curl -s -S -X POST -H "Content-Type: application/json" -d "{\"content\": \"$MESSAGE\"}" "$DISCORD_WEBHOOK" > /dev/null || echo "Warning: Failed to deliver Discord notification."

      - name: Notify Release Failure
        if: failure()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_ALERTS }}
          SHA: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK_ALERTS is not set; skipping notification."
            exit 0
          fi
          MESSAGE="Docker image build and push FAILED for ${SHA}! Check the logs here: ${SERVER_URL}/${REPO}/actions/runs/${RUN_ID}"
          curl -s -S -X POST -H "Content-Type: application/json" -d "{\"content\": \"$MESSAGE\"}" "$DISCORD_WEBHOOK" > /dev/null || echo "Warning: Failed to deliver Discord notification."
