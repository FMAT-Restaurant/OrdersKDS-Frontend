# sonar-project.properties -- SonarCloud analysis configuration for the frontend.
# Project key and organization must match the SonarCloud platform exactly.
# Token is supplied at runtime via the SONAR_TOKEN Actions secret (never commit it).
sonar.projectKey=FMAT-Restaurant_OrdersKDS-Frontend
sonar.organization=fmat-restaurant
sonar.projectName=OrdersKDS-Frontend
sonar.sourceEncoding=UTF-8

sonar.sources=src

# lcov.info is produced by vitest --coverage (v8 provider); consumed by SonarCloud for coverage display.
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.test.inclusions=**/*.test.ts,**/*.test.tsx

# Exclude generated/infrastructure files that are not meaningful to analyse.
# tests/ has its own coverage pass; dist/ is build output; src/mocks/ are MSW fixtures, not production logic.
sonar.exclusions=tests/**,dist/**,src/mocks/**

# Exclude from coverage: main.tsx is the app entry point (no logic to test),
# vite-env.d.ts is a Vite-generated type declaration file.
sonar.coverage.exclusions=src/main.tsx,src/vite-env.d.ts,src/shared/types/**
